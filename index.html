<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRUTO PROIBIDO</title>  
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">     
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Estilos de emergência: Garantem que o calendário apareça corretamente 
           mesmo se o CSS externo demorar a carregar */
        #calendario-view {
            min-height: 400px !important;
            background: white;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<header class="main-header">
    <div class="logo-container"> 
        <img src="imagens/logo.png" alt="Logo" class="header-logo">        
    </div>
</header>

<section class="marketing-gallery">
    <div class="gallery-track">
        <div class="gallery-item"><img src="https://cdn.sistemawbuy.com.br/arquivos/5e12cb7612d84173cb5477acacbf9605/produtos/697e082cb22fe/img_0391-69e175f1be912_mini.jpeg" alt="Festa"></div>
        <div class="gallery-item"><img src="https://cdn.sistemawbuy.com.br/arquivos/5e12cb7612d84173cb5477acacbf9605/produtos/6908e73997322/whatsapp-image-2025-10-31-at-17-58-05-6908f9a7a6f87_mini.jpeg" alt="Festa"></div>
        <div class="gallery-item"><img src="https://cdn.sistemawbuy.com.br/arquivos/5e12cb7612d84173cb5477acacbf9605/produtos/67ab4a64adbc9/119153-698b4f0a86000_mini.jpg" alt="Festa"></div>
        <div class="gallery-item"><img src="https://cdn.sistemawbuy.com.br/arquivos/5e12cb7612d84173cb5477acacbf9605/produtos/6914e39ba7108/img-20251121-wa0026-692072ea94e0c_mini.jpg" alt="Festa"></div>
        <div class="gallery-item"><img src="https://cdn.sistemawbuy.com.br/arquivos/5e12cb7612d84173cb5477acacbf9605/produtos/697e082cb22fe/img_0391-69e175f1be912_mini.jpeg" alt="Festa"></div>
        <div class="gallery-item"><img src="https://cdn.sistemawbuy.com.br/arquivos/5e12cb7612d84173cb5477acacbf9605/produtos/6908e73997322/whatsapp-image-2025-10-31-at-17-58-05-6908f9a7a6f87_mini.jpeg" alt="Festa"></div>
        <div class="gallery-item"><img src="https://cdn.sistemawbuy.com.br/arquivos/5e12cb7612d84173cb5477acacbf9605/produtos/67ab4a64adbc9/119153-698b4f0a86000_mini.jpg" alt="Festa"></div>
        <div class="gallery-item"><img src="https://cdn.sistemawbuy.com.br/arquivos/5e12cb7612d84173cb5477acacbf9605/produtos/6914e39ba7108/img-20251121-wa0026-692072ea94e0c_mini.jpg" alt="Festa"></div>
    </div>
</section>

<nav class="abas-navegacao">
    <button onclick="alternarSecao('catalogo')" id="btn-catalogo" class="tab-btn active">
        <i class="fas fa-store"></i> Vitrine
    </button>
    <button onclick="alternarSecao('solicitacoes')" id="btn-solicitacoes" class="tab-btn">
        <i class="fas fa-shopping-bag"></i> Meus Pedidos
    </button>
</nav>

<main class="container">
    <section id="secao-catalogo" style="display: block;"> 
      <div class="filtro-container">
            <div class="botoes-filtro-track">
                <button class="btn-filtro active" onclick="filtrarCategoria(event, 'todos')">✨ Todos</button>
                <button class="btn-filtro" onclick="filtrarCategoria(event, 'Calcinhas')">👙 Calcinhas</button>
                <button class="btn-filtro" onclick="filtrarCategoria(event, 'Conjuntos')">🛍️ Conjuntos</button>
                <button class="btn-filtro" onclick="filtrarCategoria(event, 'Acessórios')">💎 Acessórios</button>
            </div>
        </div>
        <div id="lista-itens" class="vitrine-grid"></div>
    </section>

    <section id="secao-solicitacoes" style="display: none;">
        <div class="card-consulta">
            <h3><i class="fas fa-list-ul"></i> Consultar meus Pedidos</h3>
            <div class="busca-pedido">
                <input type="tel" id="telefone-busca" placeholder="Digite seu WhatsApp (ex: 31999990000)">
                <button onclick="consultarPedidosCliente()" class="btn-buscar">
                    <i class="fas fa-search"></i> Buscar Pedidos
                </button>
            </div>
        </div>
        <div id="historico-pedidos" class="pedidos-lista"></div>
    </section>
</main>

<div id="btn-carrinho-flutuante" onclick="abrirCarrinho()" style="display: none;">
    <i class="fas fa-shopping-cart"></i>
    <span id="contador-carrinho">0</span>
</div>

<div id="modal-detalhes" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close" onclick="fecharModal('modal-detalhes')">&times;</span>
        <div id="conteudo-detalhes"></div>
    </div>
</div>

<div id="modal-carrinho" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close" onclick="fecharModal('modal-carrinho')">&times;</span>
        <h3>Seu Carrinho</h3>
        
        <div id="itens-carrinho"></div>
        <div id="total-carrinho" class="total-carrinho-box"></div>

          <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #7b001c;">
                Seu Nome:
            </label>
            <input type="text" id="nome-cliente-finalizar" 
                   placeholder="Digite seu nome completo" 
                   class="input-padrao" 
                   style="text-align: center; border: 2px solid #ddd; margin-bottom: 15px;">

            <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #7b001c;">
                Seu WhatsApp:
            </label>
            <input type="tel" id="whatsapp-cliente-finalizar" 
                   placeholder="(ex: 31999990000)" 
                   class="input-padrao" 
                   style="text-align: center; border: 2px solid #ddd;">
            <small style="color: #666; font-size: 0.8rem; display: block; margin-top: 5px;">
                *Necessário para consultar o status do seu pedido depois.
            </small>
        </div>

        <button onclick="finalizarCompraFluxoCompleto()" class="btn-solicitar" style="background-color: #25d366;">
            <i class="fab fa-whatsapp"></i> Finalizar e Enviar Pedido
        </button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
